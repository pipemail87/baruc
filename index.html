const REPORT_KEY='baruc_reports_v1';
const PROFILE_KEY='baruc_profiles_v1';
function reports(){try{return JSON.parse(localStorage.getItem(REPORT_KEY)||'[]')}catch(e){return []}}
function saveReports(a){localStorage.setItem(REPORT_KEY,JSON.stringify(a))}
function profiles(){try{return JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')}catch(e){return {}}}
function saveProfiles(o){localStorage.setItem(PROFILE_KEY,JSON.stringify(o))}
function currentMonthName(){return ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][new Date().getMonth()]}
function currentReportMonth(){const d=new Date();return `${currentMonthName()} ${d.getFullYear()}`}
function monthDateLabel(i){const y=i<4?DATA.serviceYear-1:DATA.serviceYear;return `${M[i]} ${y}`}
function reportFor(name,month=currentReportMonth()){return reports().find(r=>r.name.toLowerCase()===name.toLowerCase()&&r.month===month)}
function inactiveCount(){const rs=reports();let n=0;for(const p of DATA.people){let streak=0;for(let k=0;k<6;k++){const d=new Date();d.setMonth(d.getMonth()-k);const m=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][d.getMonth()]+' '+d.getFullYear();if(rs.some(r=>r.name.toLowerCase()===p.name.toLowerCase()&&r.month===m))break;streak++}if(streak>=6)n++}return n}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const M=DATA.months;const pct=(n,t)=>t?Math.round(n/t*100):0;
function getInactiveCount(){
  // En la preview no existe todavía el historial mensual completo.
  // La versión conectada a Drive contará 6 meses consecutivos sin informe.
  if(Array.isArray(DATA.reports)){
    const months=DATA.months||[];
    return DATA.people.filter(p=>{
      const rows=DATA.reports.filter(r=>r.name===p.name);
      if(!rows.length) return false;
      let consecutive=0;
      for(let i=months.length-1;i>=0;i--){
        const has=rows.some(r=>r.month===months[i] && r.submitted);
        if(has) consecutive=0; else consecutive++;
        if(consecutive>=6) return true;
      }
      return false;
    }).length;
  }
  return 0;
}
function dashboard(){let total=DATA.people.length,rs=reports(),month=currentReportMonth();let informed=DATA.people.filter(p=>rs.some(r=>r.name.toLowerCase()===p.name.toLowerCase()&&r.month===month)).length;let missing=Math.max(0,total-informed),inactive=inactiveCount(),types={'Precursor Regular':0,'Precursor Auxiliar':0,'Publicador':0};DATA.people.forEach(p=>types[p.type]=(types[p.type]||0)+1);let sums={Publicador:{hours:0,courses:0,count:0},'Precursor Auxiliar':{hours:0,courses:0,count:0},'Precursor Regular':{hours:0,courses:0,count:0}};rs.filter(r=>r.month===month).forEach(r=>{let x=sums[r.type]||sums.Publicador;x.count++;x.courses+=Number(r.courses||0);x.hours+=Number(r.hours||0)});let missPct=total?Math.round(missing/total*100):0;return `<div class="hero"><div><h2>Dashboard</h2><p>${esc(DATA.congregation)} · control del año de servicio ${DATA.serviceYear}</p></div><div class="actions"><button class="btn" onclick="nav('informe')">Registrar informe</button><button class="btn secondary" onclick="exportZip()">Exportar tarjetas ZIP</button></div></div><div class="card" style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap"><div><h3 style="margin:0 0 5px">Formulario para publicadores</h3><div class="mini">Enlace público independiente: solo permite diligenciar y enviar el informe mensual.</div></div><button class="btn" onclick="copyPublicLink()">📋 Copiar enlace del formulario</button></div></div><div class="grid cards"><div class="card"><div class="ringbox"><div class="ring missing" style="background:conic-gradient(var(--green) 0 ${100-missPct}%,#e8edf4 ${100-missPct}% 100%)"><div class="in"><b>${missing}</b><span>pendientes</span></div></div><div><b style="font-size:26px">${total}</b><div class="mini">publicadores</div><div class="pill green" style="margin-top:9px">${informed} informados</div><div class="inactive-badge">${inactive} inactivos</div><div class="inactive-note">Inactivo = 6 meses consecutivos sin informar.</div></div></div></div><div class="card"><div class="ringbox"><div class="ring types"><div class="in"><b>${total}</b><span>total</span></div></div><div class="legend"><div><i class="dot blue"></i>${types['Precursor Regular']} regulares</div><div><i class="dot gold"></i>${types['Precursor Auxiliar']} auxiliares</div><div><i class="dot gray"></i>${types['Publicador']} publicadores</div></div></div></div><div class="card stat"><b>${DATA.serviceYear}</b><span>Año de servicio actual</span><div class="mini" style="margin-top:8px">Septiembre 2026 → Agosto 2027</div></div><div class="card stat"><b>${month}</b><span>Mes de informe actual</span><div class="mini" style="margin-top:8px">El mes se determina automáticamente por la fecha del dispositivo.</div></div></div><div class="grid" style="grid-template-columns:1.25fr .75fr;margin-top:18px"><div class="card"><h3 style="margin-top:0">Resumen del mes</h3><div class="tablewrap"><table class="table"><thead><tr><th>Tipo</th><th>Cantidad</th><th>Horas</th><th>Cursos</th></tr></thead><tbody><tr><td><span class="pill">Publicador</span></td><td>${sums.Publicador.count}</td><td>—</td><td>${sums.Publicador.courses}</td></tr><tr><td><span class="pill gold">Precursor Auxiliar</span></td><td>${sums['Precursor Auxiliar'].count}</td><td>${sums['Precursor Auxiliar'].hours}</td><td>${sums['Precursor Auxiliar'].courses}</td></tr><tr><td><span class="pill green">Precursor Regular</span></td><td>${sums['Precursor Regular'].count}</td><td>${sums['Precursor Regular'].hours}</td><td>${sums['Precursor Regular'].courses}</td></tr></tbody></table></div></div><div class="card"><h3 style="margin-top:0">Almacenamiento</h3><div class="notice"><b>Google Drive + Apps Script</b><br>GitHub Pages solo publica los archivos de la interfaz. No debe contener datos reales ni credenciales. La conexión segura con Drive se añadirá en la siguiente fase.</div></div></div>`}
function publicadores(){let list=DATA.people.filter(p=>p.name.toLowerCase().includes(state.q.toLowerCase()));return `<div class="hero"><div><h2>Publicadores</h2><p>Los nombres se usan como identificación, según tu decisión.</p></div><button class="btn" onclick="nav('informe')">＋ Nuevo informe</button></div><div class="card"><div class="toolbar"><input class="search" placeholder="Buscar nombre…" value="${esc(state.q)}" oninput="state.q=this.value;render()"><span class="mini">${list.length} encontrados</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Nombre</th><th>Clasificación</th><th>Teléfono</th><th>Dirección</th><th>Acciones</th></tr></thead><tbody>${list.map((p,i)=>`<tr><td><b>${esc(p.name)}</b></td><td><span class="pill ${p.type==='Precursor Regular'?'green':p.type==='Precursor Auxiliar'?'gold':''}">${esc(p.type)}</span></td><td class="muted">No registrado</td><td class="muted">No registrada</td><td><button class="btn secondary" onclick="profile(${DATA.people.indexOf(p)})">Abrir tarjeta</button></td></tr>`).join('')}</tbody></table></div></div>`}
function informe(){return `<div class="hero"><div><h2>Informe mensual</h2><p>Una sola respuesta por publicador y mes. Si se vuelve a enviar, la versión final permitirá reemplazarla.</p></div></div><div class="card" style="max-width:900px"><div class="formgrid"><div><label class="label">Mes</label><select><option>Septiembre 2026</option><option>Octubre 2026</option><option>Noviembre 2026</option></select></div><div><label class="label">Publicador</label><select>${DATA.people.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select></div><div><label class="label">Clasificación</label><select><option>Publicador</option><option>Precursor Auxiliar</option><option>Precursor Regular</option></select></div><div><label class="label">Participó en alguna faceta de la predicación</label><select><option>Sí</option><option>No</option></select></div><div><label class="label">Cursos bíblicos</label><input type="number" min="0"></div><div><label class="label">Horas</label><input type="number" min="0"></div><div><label class="label">Cursos bíblicos (campo adicional)</label><input type="number" min="0"></div><div><label class="label">Horas adicionales / voluntariado</label><input type="number" min="0"></div><div class="full"><label class="label">Observaciones</label><textarea placeholder="Notas del mes…"></textarea></div><div class="full actions"><button class="btn" onclick="toast('En la versión final: guardado automático en Drive')">Guardar informe</button><button class="btn secondary" onclick="toast('Se comprobará que no exista otro informe del mismo publicador y mes')">Comprobar duplicado</button></div></div></div>`}
function publicForm(){let f=state.publicForm||{step:1,month:currentReportMonth(),name:'',type:'',participation:'',courses:'',hours:'',extra:'',facet:'',sent:false,error:''};state.publicForm=f;
if(f.sent)return `<div class="public-form"><div class="card successbox"><div class="check">✓</div><h2>Informe enviado correctamente</h2><p class="muted">Gracias. Tu informe de ${esc(f.month)} fue recibido.</p><button class="btn" onclick="state.publicForm={step:1,month:currentReportMonth(),name:'',type:'',participation:'',courses:'',hours:'',extra:'',facet:'',sent:false,error:''};renderPublic()">Enviar otro informe</button></div></div>`;
let step1=`<div class="public-form"><div class="public-top"><b>Informe mensual</b><span class="mini">Paso 1 de 2</span></div><div class="card"><div class="step"><span class="on"></span><span></span></div><div class="secure">🔒 Este formulario es independiente del área administrativa. El publicador solo puede enviar su propio informe.</div><div class="notice" style="margin-bottom:15px"><b>Informe del mes en curso: ${esc(f.month)}</b></div><div class="formgrid"><div class="full"><label class="label">Nombre y apellido</label><input id="pf-name" value="${esc(f.name)}" placeholder="Escriba su nombre"></div><div class="full"><label class="label">Seleccione una categoría</label><div class="choice"><label><input type="radio" name="pf-type" value="Publicador" ${f.type==='Publicador'?'checked':''}> Publicador</label><label><input type="radio" name="pf-type" value="Precursor Auxiliar" ${f.type==='Precursor Auxiliar'?'checked':''}> Precursor auxiliar</label><label><input type="radio" name="pf-type" value="Precursor Regular" ${f.type==='Precursor Regular'?'checked':''}> Precursor regular</label></div></div><div class="full actions"><button class="btn" onclick="publicNext()">Continuar</button></div></div></div></div>`;
if(f.step===1)return step1;let body='';if(f.type==='Publicador')body=`<div><label class="label">¿Participó en alguna faceta de la predicación durante el mes?</label><select id="pf-part"><option value="">Seleccione…</option><option ${f.participation==='Sí'?'selected':''}>Sí</option><option ${f.participation==='No'?'selected':''}>No</option></select></div><div><label class="label">¿Cuántos cursos bíblicos condujo durante el mes?</label><input id="pf-courses" type="number" min="0" step="1" value="${esc(f.courses)}"></div>`;else if(f.type==='Precursor Auxiliar')body=`<div><label class="label">Horas de predicación</label><input id="pf-hours" type="number" min="0" step="0.5" value="${esc(f.hours)}"></div><div><label class="label">Cursos bíblicos</label><input id="pf-courses" type="number" min="0" step="1" value="${esc(f.courses)}"></div>`;else body=`<div><label class="label">Horas de predicación</label><input id="pf-hours" type="number" min="0" step="0.5" value="${esc(f.hours)}"></div><div><label class="label">Cursos bíblicos</label><input id="pf-courses" type="number" min="0" step="1" value="${esc(f.courses)}"></div><div><label class="label">¿Colabora con el LDC u otra faceta?</label><select id="pf-facet"><option value="">Seleccione…</option><option ${f.facet==='Sí'?'selected':''}>Sí</option><option ${f.facet==='No'?'selected':''}>No</option></select></div><div><label class="label">Horas de LDC / otra faceta</label><input id="pf-extra" type="number" min="0" step="0.5" value="${esc(f.extra)}"></div><div class="full notice">Las horas de LDC u otra faceta se registran por separado de las horas de predicación y se acumularán para el control anual.</div>`;return `<div class="public-form"><div class="public-top"><b>Informe de ${esc(f.type)}</b><span class="mini">Paso 2 de 2</span></div><div class="card"><div class="step"><span class="on"></span><span class="on"></span></div><div class="notice" style="margin-bottom:15px"><b>${esc(f.name)}</b> · ${esc(f.month)}</div><div class="formgrid">${body}${f.error?`<div class="full alert55">⚠ ${esc(f.error)}</div>`:''}<div class="full actions"><button class="btn secondary" onclick="state.publicForm.step=1;state.publicForm.error='';renderPublic()">Atrás</button><button class="btn green" onclick="submitPublicForm()">Enviar informe</button></div></div></div></div>`}
function renderPublic(){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('title').textContent='Formulario público';document.getElementById('view').innerHTML=publicForm()}
function publicNext(){let f=state.publicForm||{};f.month=currentReportMonth();f.name=document.getElementById('pf-name').value.trim();let t=document.querySelector('input[name="pf-type"]:checked');f.type=t?t.value:'';f.error='';if(!f.name||!f.type){f.error='Complete el nombre y seleccione una categoría.';state.publicForm=f;renderPublic();return}f.step=2;state.publicForm=f;renderPublic()}
function submitPublicForm(){let f=state.publicForm;f.error='';if(f.type==='Publicador'){f.participation=document.getElementById('pf-part').value;f.courses=document.getElementById('pf-courses').value;if(!f.participation||f.courses===''){f.error='Complete todos los campos antes de enviar.';renderPublic();return}}else{f.hours=Number(document.getElementById('pf-hours').value||0);f.courses=Number(document.getElementById('pf-courses').value||0);if(f.type==='Precursor Regular'){f.facet=document.getElementById('pf-facet').value;f.extra=Number(document.getElementById('pf-extra').value||0);if(!f.facet){f.error='Indique si colabora con el LDC u otra faceta.';renderPublic();return}if(f.hours+f.extra>55){f.error=`Las horas de predicación (${f.hours}) más las horas de LDC/otra faceta (${f.extra}) suman ${f.hours+f.extra}. Debe ajustarlas para que el total no supere 55 horas.`;renderPublic();return}}if(f.hours<0||f.courses<0){f.error='Los valores no pueden ser negativos.';renderPublic();return}}let reports=reports();let record={month:f.month,name:f.name,type:f.type,participation:f.participation||null,courses:Number(f.courses||0),hours:f.type==='Publicador'?null:Number(f.hours||0),extraHours:f.type==='Precursor Regular'?Number(f.extra||0):0,facet:f.facet||null,submittedAt:new Date().toISOString()};let idx=reports.findIndex(r=>r.month===record.month&&r.name.toLowerCase()===record.name.toLowerCase());if(idx>=0)reports[idx]=record;else reports.push(record);saveReports(reports);f.sent=true;state.publicForm=f;renderPublic()}
function copyPublicLink(){let url=new URL('formulario.html',location.href).href;navigator.clipboard?.writeText(url).then(()=>toast('✓ Enlace del formulario copiado')).catch(()=>{prompt('Copia este enlace:',url)})}
function asistencia(){let a=DATA.attendance;let w=a.weekday.map(x=>x??'');let e=a.weekend.map(x=>x??'');let avg=arr=>{let v=arr.filter(x=>x!==''&&x!=null).map(Number);return v.length?(v.reduce((s,x)=>s+x,0)/v.length).toFixed(1):'—'};return `<div class="hero"><div><h2>Asistencia a las reuniones</h2><p>Se conserva el sistema del Excel: semanas, total y promedio mensual.</p></div><button class="btn" onclick="toast('En la versión final se guardará automáticamente en el histórico')">Guardar mes</button></div><div class="grid att"><div class="card"><h3 style="margin-top:0">${a.month} ${a.year} · Entre semana</h3><div class="weeks">${w.map((x,i)=>`<div><label class="label">${i+1}ª semana</label><input value="${x}" type="number" min="0"></div>`).join('')}</div><div class="total"><span>Total</span><b>${w.filter(x=>x!==''&&x!=null).reduce((s,x)=>s+Number(x),0)}</b></div><div class="total"><span>Promedio mensual</span><b>${avg(w)}</b></div></div><div class="card"><h3 style="margin-top:0">${a.month} ${a.year} · Fin de semana</h3><div class="weeks">${e.map((x,i)=>`<div><label class="label">${i+1}ª semana</label><input value="${x}" type="number" min="0"></div>`).join('')}</div><div class="total"><span>Total</span><b>${e.filter(x=>x!==''&&x!=null).reduce((s,x)=>s+Number(x),0)}</b></div><div class="total"><span>Promedio mensual</span><b>${avg(e)}</b></div></div></div><div class="card" style="margin-top:18px"><h3 style="margin-top:0">Histórico</h3><table class="table"><thead><tr><th>Año</th><th>Mes</th><th>Reunión</th><th>Total</th><th>Promedio mensual</th></tr></thead><tbody><tr><td>2026</td><td>Mayo</td><td>Entre semana</td><td>98</td><td>19.6</td></tr><tr><td>2026</td><td>Mayo</td><td>Fin de semana</td><td>111</td><td>22.2</td></tr></tbody></table></div>`}
function config(){return `<div class="hero"><div><h2>Configuración</h2><p>Solo tú tendrás acceso administrativo en esta primera versión.</p></div></div><div class="card" style="max-width:900px"><div class="formgrid"><div class="full"><label class="label">Nombre de la congregación</label><input id="cong" value="${esc(DATA.congregation)}"></div><div><label class="label">Año de servicio</label><input value="2027" disabled></div><div><label class="label">Periodo</label><input value="Septiembre 2026 → Agosto 2027" disabled></div><div class="full"><label class="label">Datos personales por publicador</label><div class="notice">Nombre, teléfono y dirección serán editables. También se conservarán los campos del S-21-S: nacimiento, bautismo, sexo, esperanza y privilegios.</div></div><div class="full"><label class="label">Almacenamiento</label><div class="notice"><b>Google Drive + Apps Script</b><br>Es la opción que propongo para evitar depender de Notion y mantener PDFs, datos y ZIP en tu propia cuenta de Google.</div></div><div class="full actions"><button class="btn" onclick="saveCong()">Guardar</button><button class="btn secondary" onclick="toast('La conexión real a Google se añadirá en la fase de almacenamiento')">Conectar Google Drive</button></div></div></div><div class="card" style="margin-top:18px"><h3 style="margin-top:0">Importación</h3><p class="mini">No se incluirá importación automática del Excel, según tu indicación. El Excel solo sirve como referencia para reproducir los campos y cálculos.</p></div>`}
function profile(i){let p=DATA.people[i],ps=profiles()[p.name]||{};p={...p,...ps};document.getElementById('modalbox').innerHTML=`<div class="hero"><div><h2 style="font-size:20px">${esc(p.name)}</h2><p>Tarjeta del publicador · edición de datos personales</p></div><button class="btn secondary" onclick="closeModal()">Cerrar</button></div><div class="profile"><div class="card"><h3 style="margin-top:0">Datos personales</h3><div><label class="label">Nombre</label><input value="${esc(p.name)}"></div><div style="margin-top:10px"><label class="label">Teléfono</label><input placeholder="Teléfono"></div><div style="margin-top:10px"><label class="label">Dirección</label><textarea placeholder="Dirección"></textarea></div><div style="margin-top:10px"><label class="label">Clasificación</label><select><option ${p.type==='Publicador'?'selected':''}>Publicador</option><option ${p.type==='Precursor Auxiliar'?'selected':''}>Precursor Auxiliar</option><option ${p.type==='Precursor Regular'?'selected':''}>Precursor Regular</option></select></div><div class="actions" style="margin-top:15px"><button class="btn" onclick="saveProfile(${i})">Guardar datos</button><button class="btn secondary" onclick="openPdf(${i})">Ver S-21-S</button></div></div><div class="card"><h3 style="margin-top:0">Año de servicio ${DATA.serviceYear}</h3><div class="months">${M.map((m,mi)=>{let rr=reportFor(p.name,monthDateLabel(mi));return `<div class="month"><b>${m}</b><strong>${rr?'✓':'—'}</strong><small>${rr?`Informe registrado · ${rr.hours??'—'} h`:'Sin informe'}</small></div>`}).join('')}</div><div class="actions" style="margin-top:15px"><button class="btn green" onclick="openPdf(${i})">Descargar tarjeta PDF</button><button class="btn secondary" onclick="nav('informe');closeModal()">Agregar/editar informe</button></div></div></div>`;document.getElementById('modal').classList.add('show')}
function saveProfile(i){let p=DATA.people[i],box=document.getElementById('modalbox'),inputs=box.querySelectorAll('input,textarea,select');let name=inputs[0].value.trim();let phone=inputs[1].value.trim();let address=inputs[2].value.trim();let type=inputs[3].value;let ps=profiles();delete ps[p.name];ps[name]={phone,address,type};p.name=name;p.type=type;DATA.people[i]=p;saveProfiles(ps);toast('Datos guardados en este dispositivo');closeModal();render()}
function openPdf(i=0){let p=DATA.people[i]||DATA.people[0];document.getElementById('modalbox').innerHTML=`<div class="hero"><div><h2 style="font-size:20px">Vista del S-21-S</h2><p>Réplica visual de referencia; la generación final usará el formato del documento adjunto.</p></div><button class="btn secondary" onclick="closeModal()">Cerrar</button></div><div class="pdf"><h2>REGISTRO DE PUBLICADOR DE LA CONGREGACIÓN</h2><div class="pdfhead"><div><b>Nombre:</b> ${esc(p.name)}</div><div><b>Fecha de nacimiento:</b> __________________ &nbsp;&nbsp; ☐ Hombre &nbsp; ☐ Mujer</div><div><b>Fecha de bautismo:</b> __________________ &nbsp;&nbsp; ☐ Otras ovejas &nbsp; ☐ Ungido</div><div class="pdfchecks">☐ Anciano &nbsp; ☐ Siervo ministerial &nbsp; ${p.type==='Precursor Regular'?'☑':'☐'} Precursor regular &nbsp; ${p.type==='Precursor Auxiliar'?'☑':'☐'} Precursor auxiliar &nbsp; ☐ Precursor especial &nbsp; ☐ Misionero que sirve en el campo</div></div><table class="pdftable"><thead><tr><th>Año de servicio</th><th>Participación<br>en el ministerio</th><th>Cursos<br>bíblicos</th><th>Precursor<br>auxiliar</th><th>Horas<br>(Si es precursor o misionero que sirve en el campo)</th><th>Notas</th></tr></thead><tbody>${M.map(m=>`<tr><td>${m}</td><td>☐</td><td></td><td>☐</td><td></td><td></td></tr>`).join('')}<tr><td colspan="4" style="text-align:right"><b>Total</b></td><td><b>—</b></td><td></td></tr></tbody></table><div style="font-size:8px;margin-top:9px">S-21-S 11/23</div></div><div class="actions" style="justify-content:flex-end;margin-top:10px"><button class="btn" onclick="window.print()">Imprimir / guardar como PDF</button></div>`;document.getElementById('modal').classList.add('show')}
function exportZip(){toast('Preview: el botón está preparado. En la versión final generará un ZIP con un PDF S-21-S por publicador.')}function saveCong(){let x=document.getElementById('cong').value.trim();if(x)DATA.congregation=x;toast('Nombre actualizado en la preview');render()}function nav(v){state.view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));document.getElementById('title').textContent={dashboard:'Dashboard',publicadores:'Publicadores',informe:'Informe mensual',asistencia:'Asistencia',config:'Configuración'}[v];render()}function render(){document.getElementById('view').innerHTML={dashboard,publicadores,informe,asistencia,config}[state.view]()}function closeModal(){document.getElementById('modal').classList.remove('show')}function toast(s){let t=document.createElement('div');t.textContent=s;t.style.cssText='position:fixed;right:20px;bottom:20px;background:#182033;color:white;padding:12px 15px;border-radius:12px;z-index:100;box-shadow:0 10px 28px rgba(0,0,0,.18)';document.body.appendChild(t);setTimeout(()=>t.remove(),2300)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.v));document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};if(location.hash==='#formulario-publico'){state.publicForm={step:1,month:currentReportMonth(),name:'',type:'',participation:'',courses:'',hours:'',extra:'',facet:'',sent:false,error:''};renderPublic()}else render();</script></body></html>
