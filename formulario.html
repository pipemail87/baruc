<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barúc · Informe mensual</title>
<link rel="icon" type="image/png" href="assets/logo-baruc.png">
<style>
:root{--bg:#f5f7fb;--surface:#fff;--text:#182033;--muted:#687386;--line:#e2e8f0;--primary:#315efb;--primaryDark:#1e43c7;--green:#198754;--red:#c84b4b;--shadow:0 10px 28px rgba(24,39,75,.08);--r:18px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:720px;margin:0 auto;padding:24px 16px 40px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}.brand img{width:42px;height:42px;object-fit:contain}.brand b{font-size:20px}.brand small{display:block;color:var(--muted);font-size:11px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}.step{display:flex;gap:7px;margin-bottom:20px}.step span{height:7px;flex:1;border-radius:99px;background:#e7ebf3}.step span.on{background:var(--primary)}h1{font-size:24px;margin:0 0 6px}p{color:var(--muted);font-size:13px;line-height:1.5}.notice{padding:12px 14px;border-radius:12px;background:#eef5ff;border:1px solid #d8e5ff;color:#38558e;font-size:12px;line-height:1.5;margin:16px 0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}.label{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}.choice{display:grid;gap:10px}.choice label{border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer}.choice label:has(input:checked){border-color:var(--primary);background:#f2f5ff}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}.btn{border:0;background:var(--primary);color:#fff;border-radius:11px;padding:11px 15px;font-weight:700}.btn:hover{background:var(--primaryDark)}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.green{background:var(--green)}.alert{background:#fff0f0;border:1px solid #f0b7b7;color:#9c2f2f;padding:12px;border-radius:12px;font-size:12px;margin-top:10px}.success{text-align:center;padding:25px}.check{font-size:48px;color:var(--green)}.mini{font-size:11px;color:var(--muted)}@media(max-width:650px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:16px 12px 30px}.card{padding:18px}}
</style></head>
<body><main class="wrap" id="app"></main>
<script>
const app=document.getElementById('app');
const KEY='baruc_reports_v1';
const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function currentMonth(){const d=new Date();return `${monthNames[d.getMonth()]} ${d.getFullYear()}`}
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function save(a){localStorage.setItem(KEY,JSON.stringify(a))}
let f={step:1,name:'',type:'',participation:'',courses:'',hours:'',facet:'',extra:'',error:'',sent:false};
function shell(body){app.innerHTML=`<div class="brand"><img src="assets/logo-baruc.png" alt="Barúc"><div><b>Barúc</b><small>Informe mensual de publicadores</small></div></div>${body}`}
function render(){if(f.sent){shell(`<div class="card success"><div class="check">✓</div><h1>Informe enviado correctamente</h1><p>Tu informe de <b>${currentMonth()}</b> quedó registrado en este dispositivo.</p><p class="mini">En la versión conectada con Google Apps Script, el informe llegará automáticamente a la administración.</p><button class="btn" onclick="f={step:1,name:'',type:'',participation:'',courses:'',hours:'',facet:'',extra:'',error:'',sent:false};render()">Enviar otro informe</button></div>`);return}
if(f.step===1){shell(`<div class="card"><div class="step"><span class="on"></span><span></span></div><h1>Informe mensual</h1><p>Complete sus datos. El mes se determina automáticamente según la fecha del dispositivo.</p><div class="notice"><b>Mes del informe: ${currentMonth()}</b></div><div class="formgrid"><div class="full"><label class="label">Nombre y apellido</label><input id="name" value="${esc(f.name)}" placeholder="Escriba su nombre"></div><div class="full"><label class="label">Seleccione una categoría</label><div class="choice"><label><input type="radio" name="type" value="Publicador" ${f.type==='Publicador'?'checked':''}> Publicador</label><label><input type="radio" name="type" value="Precursor Auxiliar" ${f.type==='Precursor Auxiliar'?'checked':''}> Precursor auxiliar</label><label><input type="radio" name="type" value="Precursor Regular" ${f.type==='Precursor Regular'?'checked':''}> Precursor regular</label></div></div>${f.error?`<div class="full alert">⚠ ${esc(f.error)}</div>`:''}<div class="full actions"><button class="btn" onclick="next()">Continuar</button></div></div></div>`);return}
let body='';
if(f.type==='Publicador')body=`<div><label class="label">¿Participó en alguna faceta de la predicación durante el mes?</label><select id="part"><option value="">Seleccione…</option><option ${f.participation==='Sí'?'selected':''}>Sí</option><option ${f.participation==='No'?'selected':''}>No</option></select></div><div><label class="label">Cursos bíblicos conducidos</label><input id="courses" type="number" min="0" step="1" value="${esc(f.courses)}"></div>`;
else if(f.type==='Precursor Auxiliar')body=`<div><label class="label">Horas de predicación</label><input id="hours" type="number" min="0" step="0.5" value="${esc(f.hours)}"></div><div><label class="label">Cursos bíblicos</label><input id="courses" type="number" min="0" step="1" value="${esc(f.courses)}"></div>`;
else body=`<div><label class="label">Horas de predicación</label><input id="hours" type="number" min="0" step="0.5" value="${esc(f.hours)}"></div><div><label class="label">Cursos bíblicos</label><input id="courses" type="number" min="0" step="1" value="${esc(f.courses)}"></div><div><label class="label">¿Colabora con el LDC u otra faceta?</label><select id="facet"><option value="">Seleccione…</option><option ${f.facet==='Sí'?'selected':''}>Sí</option><option ${f.facet==='No'?'selected':''}>No</option></select></div><div><label class="label">Horas de LDC / otra faceta</label><input id="extra" type="number" min="0" step="0.5" value="${esc(f.extra)}"></div><div class="full notice">Las horas de predicación y las horas de LDC/otra faceta se almacenan por separado. El control anual de las 600 horas se realizará en la tarjeta del publicador.</div>`;
shell(`<div class="card"><div class="step"><span class="on"></span><span class="on"></span></div><h1>Informe de ${esc(f.type)}</h1><p><b>${esc(f.name)}</b> · ${currentMonth()}</p><div class="formgrid">${body}${f.error?`<div class="full alert">⚠ ${esc(f.error)}</div>`:''}<div class="full actions"><button class="btn secondary" onclick="f.step=1;f.error='';render()">Atrás</button><button class="btn green" onclick="submit()">Enviar informe</button></div></div></div>`)}
function next(){f.name=document.getElementById('name').value.trim();const r=document.querySelector('input[name="type"]:checked');f.type=r?r.value:'';f.error='';if(!f.name||!f.type){f.error='Complete el nombre y seleccione una categoría.';render();return}f.step=2;render()}
function submit(){f.error='';if(f.type==='Publicador'){f.participation=document.getElementById('part').value;f.courses=document.getElementById('courses').value;if(!f.participation||f.courses===''){f.error='Complete todos los campos antes de enviar.';render();return}}else{f.hours=Number(document.getElementById('hours').value||0);f.courses=Number(document.getElementById('courses').value||0);if(f.type==='Precursor Regular'){f.facet=document.getElementById('facet').value;f.extra=Number(document.getElementById('extra').value||0);if(!f.facet){f.error='Indique si colabora con el LDC u otra faceta.';render();return}if(f.hours+f.extra>55){f.error=`Las horas de predicación (${f.hours}) más las horas de LDC/otra faceta (${f.extra}) suman ${f.hours+f.extra}. Ajuste los valores hasta 55 horas o menos.`;render();return}}if(f.hours<0||f.courses<0){f.error='Los valores no pueden ser negativos.';render();return}}
const a=read();const rec={month:currentMonth(),name:f.name,type:f.type,participation:f.participation||null,courses:Number(f.courses||0),hours:f.type==='Publicador'?null:Number(f.hours||0),extraHours:f.type==='Precursor Regular'?Number(f.extra||0):0,facet:f.facet||null,submittedAt:new Date().toISOString()};const i=a.findIndex(x=>x.month===rec.month&&x.name.toLowerCase()===rec.name.toLowerCase());if(i>=0)a[i]=rec;else a.push(rec);save(a);f.sent=true;render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
render();
</script></body></html>
